name: CI — Dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "pom.xml"
  pull_request:
    branches: [dev]

jobs:
  ci:
    name: Backend CI
    uses: clvster/tripgen-devops/.github/workflows/reusable-backend-ci.yml@main
    secrets: inherit

  bump-patch:
    name: Bump patch version
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: dev

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Bump patch in pom.xml
        run: |
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          mvn versions:set -DnewVersion="$NEW" -DgenerateBackupPoms=false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore: bump version to $NEW [skip ci]"
          git tag "backend-v$NEW"
          git push origin dev
          git push origin "backend-v$NEW"
